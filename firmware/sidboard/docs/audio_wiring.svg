<polyline points="1000,720 1080,720 1080,646" fill="none" stroke="#404040" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1000" cy="720" r="5" fill="#404040" stroke="#333" stroke-width="1.2"/>
<circle cx="1080" cy="646" r="5" fill="#404040" stroke="#333" stroke-width="1.2"/>
<text x="330" y="746" font-size="13" text-anchor="start" fill="#333" font-weight="bold">4. GND from J2-2 (module GND) to C2 and ECI H</text>
<text x="40" y="796" font-size="12" text-anchor="start" fill="#333" font-weight="normal">Why: U3 pin 6 (A side of the TXS0108E) shares the net with D25.  The TXS0108E has internal pull-ups (4 kΩ / 40 kΩ, to 3.3 V on A and 5 V on B)</text>
<text x="40" y="814" font-size="12" text-anchor="start" fill="#333" font-weight="normal">and one-shot edge accelerators while OE is high: on an analog DAC signal they shift the level and distort it.  Taking the signal from the module</text>
<text x="40" y="832" font-size="12" text-anchor="start" fill="#333" font-weight="normal">pin is not enough while the pin is still in the socket: it is the same copper.  GPIO26 (DAC2) has the same problem (J2-7, U3-7).</text>
<text x="40" y="850" font-size="12" text-anchor="start" fill="#333" font-weight="normal">Values from the sidboard README; with 100 kΩ and 10 nF the low-pass sits at about 160 Hz: use 1 nF (≈ 1.6 kHz) for brighter sound.</text>
</svg>