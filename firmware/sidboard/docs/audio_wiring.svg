<text x="80" y="400" font-size="13" text-anchor="start" fill="#c62828" font-weight="bold">1. D25 pin of the module bent out</text>
<text x="80" y="418" font-size="12" text-anchor="start" fill="#c62828" font-weight="normal">   (or cut): it must not enter J2-8</text>
<text x="80" y="442" font-size="12" text-anchor="start" fill="#555" font-weight="normal">   alternative: cut the D25 trace</text>
<text x="80" y="458" font-size="12" text-anchor="start" fill="#555" font-weight="normal">   between J2-8 and U3-6 (red X)</text>
