; sidboard: SID 6581/8580 sound for the Atari 8-bit on the ESP32-BOBOARD-5V.
;
;   sid-cctl   SID at $D500-$D51E (~CCTL, J3 pin 12), always on
;   sid-pbi    SID at $D100-$D11E (~D1XX, J3 pin 11), PBI device ID $80,
;              select latch $D1FF
;
; Demo builds: the same plus a built-in tune (AUDIO_DEMO, Commando at 50 Hz,
; looping), audible with no computer attached:
;   sid-demo-cctl, sid-demo-pbi, sid-c64-demo-io1, sid-c64-demo-io2
;
; sidboard on the Commodore 64 expansion port (second SID, always on), the
; block is chosen with SID_C64_IO:
;   sid-c64-io1  SID at $DE00-$DE1E (/IO1 -> J3 pin 12)
;   sid-c64-io2  SID at $DF00-$DF1E (/IO2 -> J3 pin 11)
;
; The ESP32 module is programmed only disconnected from the Atari, from the PC.

[env]
platform = espressif32@6.6.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000
extra_scripts =
    post:efuse_vdd_sdio.py

; Serial monitor: do not toggle RTS / DTR (they reset the ESP32 through EN /
; GPIO0 while it sits on the Atari bus).
monitor_rts = 0
monitor_dtr = 0

; GPIO12 (MTDI) is still wired to U1 / J3 pin 4: the VDD_SDIO efuses are
; checked before every upload and burnt to 3.3 V if blank (irreversible).
custom_efuse_vdd_sdio = 3.3V

build_flags =
    -O3
    -Wno-shift-count-overflow
    -D USE_ESP32_REGISTER_ACCESS
    -I include

[env:sid-cctl]
build_flags =
    ${env.build_flags}
    -D SID_MODE_PBI=0

[env:sid-pbi]
build_flags =
    ${env.build_flags}
    -D SID_MODE_PBI=1

[env:sid-c64-io1]
build_flags =
    ${env.build_flags}
    -D SID_BUS_C64=1
    -D SID_C64_IO=1

[env:sid-c64-io2]
build_flags =
    ${env.build_flags}
    -D SID_BUS_C64=1
    -D SID_C64_IO=2

[env:sid-demo-cctl]
extends = env:sid-cctl
build_flags =
    ${env:sid-cctl.build_flags}
    -D AUDIO_DEMO
    -I examples

[env:sid-demo-pbi]
extends = env:sid-pbi
build_flags =
    ${env:sid-pbi.build_flags}
    -D AUDIO_DEMO
    -I examples

[env:sid-c64-demo-io1]
extends = env:sid-c64-io1
build_flags =
    ${env:sid-c64-io1.build_flags}
    -D AUDIO_DEMO
    -I examples

[env:sid-c64-demo-io2]
extends = env:sid-c64-io2
build_flags =
    ${env:sid-c64-io2.build_flags}
    -D AUDIO_DEMO
    -I examples
