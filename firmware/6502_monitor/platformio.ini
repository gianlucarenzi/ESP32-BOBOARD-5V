[env]
extra_scripts =
    pre:pre_build.py
    post:efuse_vdd_sdio.py

; Serial monitor: do not toggle RTS / DTR.  On the NodeMCU they drive EN and
; GPIO0 through the auto-reset transistors: opening the monitor would reset
; the ESP32 while it sits on the Atari bus.
monitor_rts = 0
monitor_dtr = 0

; GPIO12 (MTDI) is A8: at every chip reset its level would select the flash
; voltage (HIGH = 1.8 V, the WROOM-32 flash needs 3.3 V).  efuse_vdd_sdio.py
; checks the VDD_SDIO efuses before every upload and, if they are still
; blank, burns them to a fixed 3.3 V (espefuse set_flash_voltage 3.3V,
; irreversible) so that GPIO12 is ignored.  Empty value = no check.
custom_efuse_vdd_sdio = 3.3V

[env:nodemcu-32s]
platform = espressif32@6.6.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000
build_flags =
    -O3
    -Wno-shift-count-overflow    
    -D USE_ESP32_REGISTER_ACCESS
    -I include
    -D BUS_MODE=0
    -D HARDWARE_TARGET=0

[env:nodemcu-32s-cctl]
platform = espressif32@6.6.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000
build_flags =
    -O3
    -Wno-shift-count-overflow    
    -D USE_ESP32_REGISTER_ACCESS
    -I include
    -D BUS_MODE=1
    -D HARDWARE_TARGET=0

upload_speed = 921600
