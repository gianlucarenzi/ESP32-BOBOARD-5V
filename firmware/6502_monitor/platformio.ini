[env]
extra_scripts =
    post:efuse_vdd_sdio.py

; Serial monitor: do not toggle RTS / DTR.  On the NodeMCU they drive EN and
; GPIO0 through the auto-reset transistors: opening the monitor would reset
; the ESP32 while it sits on the Atari bus.
monitor_rts = 0
monitor_dtr = 0

; GPIO12 (MTDI) is still wired to U1 / J3 pin 4 (former A8): at every chip
; reset its level would select the flash voltage (HIGH = 1.8 V, the WROOM-32
; flash needs 3.3 V).  efuse_vdd_sdio.py checks the VDD_SDIO efuses before
; every upload and, if they are still blank, burns them to a fixed 3.3 V
; (espefuse set_flash_voltage 3.3V, irreversible) so that GPIO12 is ignored.
; Empty value = no check.
custom_efuse_vdd_sdio = 3.3V

; ROM-less PBI / CCTL peripheral: ~D1XX and ~CCTL windows, A0-A7.
[env:nodemcu-32s]
platform = espressif32@6.6.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000
build_flags =
    -O3
    -Wno-shift-count-overflow
    -D USE_ESP32_REGISTER_ACCESS
    -I include

; Commodore 64 expansion port, GeoRAM compatible: /IO1 -> J3 pin 12 (GPIO23,
; ~CCTL input), /IO2 -> J3 pin 11 (GPIO22, ~D1XX input).  Decode during PHI2
; high (the VIC-II owns PHI1), 1 MHz timing.
[env:c64]
extends = env:nodemcu-32s
build_flags =
    ${env:nodemcu-32s.build_flags}
    -D BUS_C64=1
