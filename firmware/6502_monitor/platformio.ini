[env:nodemcu-32s]
platform = espressif32@6.6.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000
build_flags =
    -O3
    -Wno-shift-count-overflow    
    -D USE_ESP32_REGISTER_ACCESS
    -I include
    -D BUS_MODE=0

[env:nodemcu-32s-cctl]
platform = espressif32@6.6.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000
build_flags =
    -O3
    -Wno-shift-count-overflow    
    -D USE_ESP32_REGISTER_ACCESS
    -I include
    -D BUS_MODE=1

upload_speed = 921600
